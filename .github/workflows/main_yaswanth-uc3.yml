# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - yaswanth-uc3

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/main_yaswanth-uc3.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Repo root is a monorepo (backend/, frontend/, corpusgen/ as siblings) -- the
      # app itself lives in backend/, so both the local validation install AND the
      # actual deployed package are explicitly scoped there. No .deployment/project=
      # redirect needed: this is unambiguous, package: backend below deploys
      # backend/'s CONTENTS as the site root, not a nested backend/ folder.
      - name: Install dependencies (local validation)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'yaswanth-uc3'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_A55CAE3C585F45F6BFB155433E2F41DE }}
          package: backend
